<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Developer Language Explorer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #666;
        }

        .overview {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #666;
            font-size: 15px;
        }

        .metric {
            font-size: 32px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            margin-top: 0;
        }

        ol {
            padding-left: 25px;
        }

        li {
            padding: 8px 0;
        }

        .language-item {
            margin-bottom: 18px;
        }

        .language-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .bar-container {
            width: 100%;
            height: 14px;
            background: #e9ecef;
            border-radius: 7px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            background: #333;
            border-radius: 7px;
        }

        .language-item {
            margin-bottom: 18px;
        }

        .language-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .bar-container {
            width: 100%;
            height: 14px;
            background: #e9ecef;
            border-radius: 7px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            background: #333;
            border-radius: 7px;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>Developer Language Explorer</h1>
            <p>Exploring programming language usage across developers</p>
        </header>


        <!-- Overview -->

        <div class="overview">

            <div class="card">
                <h3>Developers Analyzed</h3>
                <div class="metric" id="respondents"></div>
            </div>

            <div class="card">
                <h3>Average Languages / Developer</h3>
                <div class="metric" id="average"></div>
            </div>

        </div>


        <!-- Top Languages -->

        <div class="section">

            <h2>Top Languages</h2>

            <ol id="languages"></ol>

        </div>


        <!-- Language Pairs -->

        <div class="section">

            <h2>Common Language Pairs</h2>

            <ol id="pairs"></ol>

        </div>

        <div class="section">

            <h2>Most Common Language Partner</h2>

            <div id="partners"></div>

        </div>

    </div>


    <script>

        fetch("report.json")
            .then(response => response.json())
            .then(data => {

                // Overview

                document.getElementById("respondents").textContent =
                    data.respondents.toLocaleString();

                document.getElementById("average").textContent =
                    data.averageLanguages.toFixed(2);


                // Top languages

                const languageList =
                    document.getElementById("languages");

                const maxLanguageCount =
                    Math.max(...data.topLanguages.map(language => language.count));

                data.topLanguages.forEach(language => {

                    const item = document.createElement("div");

                    item.className = "language-item";

                    const info = document.createElement("div");

                    info.className = "language-info";

                    info.innerHTML =
                        "<strong>" + language.name + "</strong>"
                        + "<span>" + language.count.toLocaleString() + "</span>";

                    const barContainer =
                        document.createElement("div");

                    barContainer.className = "bar-container";

                    const bar =
                        document.createElement("div");

                    bar.className = "bar";

                    const width =
                        (language.count / maxLanguageCount) * 100;

                    bar.style.width = width + "%";

                    barContainer.appendChild(bar);

                    item.appendChild(info);
                    item.appendChild(barContainer);

                    languageList.appendChild(item);
                });


                // Language pairs

                const pairList =
                    document.getElementById("pairs");

                const maxPairCount =
                    Math.max(...data.topPairs.map(pair => pair.count));

                data.topPairs.forEach(pair => {

                    const item = document.createElement("div");

                    item.className = "language-item";

                    const info = document.createElement("div");

                    info.className = "language-info";

                    info.innerHTML =
                        "<strong>" + pair.pair + "</strong>"
                        + "<span>" + pair.count.toLocaleString() + "</span>";

                    const barContainer =
                        document.createElement("div");

                    barContainer.className = "bar-container";

                    const bar =
                        document.createElement("div");

                    bar.className = "bar";

                    const width =
                        (pair.count / maxPairCount) * 100;

                    bar.style.width = width + "%";

                    barContainer.appendChild(bar);

                    item.appendChild(info);
                    item.appendChild(barContainer);

                    pairList.appendChild(item);

                });

                const partnerList =
                    document.getElementById("partners");

                Object.values(data.bestPartners).forEach(partner => {

                    const item = document.createElement("div");

                    item.className = "language-item";

                    const info = document.createElement("div");

                    info.className = "language-info";

                    info.innerHTML =
                        "<strong>" + partner.language + "</strong>"
                        + "<span>"
                        + partner.partner
                        + " — "
                        + partner.count.toLocaleString()
                        + "</span>";

                    const barContainer =
                        document.createElement("div");

                    barContainer.className = "bar-container";

                    const bar =
                        document.createElement("div");

                    bar.className = "bar";

                    const maxPartnerCount =
                        Math.max(
                            ...Object.values(data.bestPartners)
                                .map(partner => partner.count)
                        );

                    const width =
                        (partner.count / maxPartnerCount) * 100;

                    bar.style.width = width + "%";

                    barContainer.appendChild(bar);

                    item.appendChild(info);
                    item.appendChild(barContainer);

                    partnerList.appendChild(item);
                });
            });

    </script>

</body>

</html>
